<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>REPORTE LOGIZTIK GROUP MARITIMO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: una columna. Datos arriba, luego una sección desplegable por hoja del reporte, barra fija abajo con el botón de PDF. */
:root {
  --bg: #eef0ee; --surface: #ffffff; --ink: #1b221d; --muted: #5d685f; --line: #d3d9d3;
  --accent: #1f6b3a; --accent-ink: #ffffff; --accent-soft: #e0efe5; --drop: #f6f8f5; --danger: #a32a1f;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131814; --surface: #1c231e; --ink: #e8ede8; --muted: #9aa69c; --line: #324036;
    --accent: #7cc24a; --accent-ink: #0f1a09; --accent-soft: #24331b; --drop: #181f1a; --danger: #ff8b7e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131814; --surface: #1c231e; --ink: #e8ede8; --muted: #9aa69c; --line: #324036;
  --accent: #7cc24a; --accent-ink: #0f1a09; --accent-soft: #24331b; --drop: #181f1a; --danger: #ff8b7e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 240px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.brand { background: #fff; border-radius: 6px; padding: 6px 10px; width: min(380px, 100%); }
.brand img { width: 100%; height: auto; display: block; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 12px 0 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 64ch; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.btn2 { font: inherit; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.btn2:hover { border-color: var(--accent); }
.btn2[disabled] { opacity: .45; cursor: default; }
.btn2.danger:hover { border-color: var(--danger); }
.fitopt { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.fitopt select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; }

details.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
details.sheet[open] { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
details.sheet > summary {
  list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 12px; justify-content: space-between;
}
details.sheet > summary::-webkit-details-marker { display: none; }
details.sheet > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.s-left { display: flex; flex-direction: column; min-width: 0; }
.s-title { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; overflow-wrap: anywhere; }
.s-note { font-size: 12.5px; color: var(--muted); }
.s-right { display: flex; align-items: center; gap: 10px; flex: none; }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--drop); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.req { border-style: dashed; }
.caret { width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; margin-top: -4px; }
details[open] > summary .caret { transform: rotate(-135deg); margin-top: 4px; }
.sbody { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.subh { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%; min-width: 0; }
.field input::placeholder { color: var(--muted); opacity: .7; }
.field.mono input { font-family: var(--font-mono); letter-spacing: .03em; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dt { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.dt-row { display: grid; grid-template-columns: minmax(130px, .9fr) 2.4fr; border-top: 1px solid var(--line); }
.dt-row:first-child { border-top: 0; }
.dt-row.four { grid-template-columns: minmax(130px, .9fr) 1.4fr minmax(100px, .6fr) 1fr; }
.dt-l { background: var(--drop); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 11px 12px; display: flex; align-items: center; border-right: 1px solid var(--line); }
.dt-c { min-width: 0; display: flex; }
.dt-c input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; font: inherit; color: var(--ink); padding: 10px 12px; border-radius: 0; }
.dt-c input::placeholder { color: var(--muted); opacity: .65; }
.dt-c input:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.dt-row.four .dt-l:nth-child(3) { border-left: 1px solid var(--line); }
@media (max-width: 640px) {
  .dt-row.four { grid-template-columns: minmax(110px, .9fr) 1.6fr; }
  .dt-row.four .dt-l:nth-child(3) { border-left: 0; border-top: 1px solid var(--line); }
  .dt-row.four .dt-c:nth-child(4) { border-top: 1px solid var(--line); }
}
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.slots.big { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.slot { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.slot-label { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; display: flex; justify-content: space-between; gap: 6px; }
.slot-label small { font-weight: 400; color: var(--muted); font-family: var(--font-mono); font-size: 11px; white-space: nowrap; }
.frame { position: relative; border: 1.5px dashed var(--line); background: var(--drop); border-radius: 6px; overflow: hidden; width: 100%; }
.frame.has { border: 1px solid var(--accent); }
.frame > .drop { all: unset; box-sizing: border-box; position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 8px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
.frame > .drop:hover, .frame.over > .drop { background: var(--accent-soft); color: var(--ink); }
.frame > .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
body[data-fit="fill"] .frame img { object-fit: cover; }
.frame .acts { position: absolute; inset: auto 0 0 0; display: flex; background: rgba(0,0,0,.65); }
.frame .acts button { all: unset; flex: 1; text-align: center; color: #fff; font-size: 12px; padding: 7px 4px; cursor: pointer; }
.frame .acts button:hover { background: rgba(255,255,255,.2); }
.frame .acts button:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
.frame.busy::after { content: "Procesando"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.dock {
  position: fixed; left: 0; right: 0; z-index: 5; pointer-events: none; display: flex; justify-content: center;
  bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dock-in {
  pointer-events: auto; width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,.22); padding: 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
}
.summary { display: flex; flex-direction: column; min-width: 0; align-items: center; }
.summary b { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--danger); }
.status.ok { color: var(--accent); }
.go { width: min(100%, 320px); font: inherit; font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 12px 22px; cursor: pointer; }
.go[disabled] { opacity: .45; cursor: default; }
.go:not([disabled]):hover { filter: brightness(1.1); }
@media (prefers-reduced-motion: no-preference) { .btn2, .go, .frame > .drop { transition: background .15s, border-color .15s, filter .15s; } }
</style>

  /* ======== Generador de PDF (sin librerías) ======== */
  function latin1(str) {

    var out = new Uint8Array(str.length);

  };

  };

  PdfDoc.prototype.imageFill = function (p, id, bx, by, bw, bh, iw, ih) {
    p.imgs[id] = true;
    p.ops.push("q " + num(bx) + " " + num(PH - by - bh) + " " + num(bw) + " " + num(bh) + " re W n " + num(iw) + " 0 0 " + num(ih) + " " + num(bx + (bw - iw) / 2) + " " + num(PH - by - bh + (bh - ih) / 2) + " cm /Im" + id + " Do Q");

  };

    obj(2, "<< /Type /Pages /Count " + this.pages.length + " /Kids [" + kids.join(" ") + "] >>");
    obj(3, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    obj(4, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");

      put(latin1(n + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + im.w + " /Height " + im.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + im.bytes.length + " >>\nstream\n"));
      put(im.bytes); put(latin1("\nendstream\nendobj\n"));

  }

    this.doc.text(this.pg, s, (PW - tw(s, TITLE_FS, true)) / 2, this.y, TITLE_FS, true); this.y += T_GAP;
  };
  Sheet.prototype.gap = function (v) { this.y += cm(v); };
  /* Una fila de recuadros centrada. items: [{label, photo, id}] */
  Sheet.prototype.row = function (items, W, H, gap) {
    var n = items.length; if (!n) return;
    var w = cm(W), h = cm(H), g = cm(gap || 0), total = n * w + (n - 1) * g, x0 = (PW - total) / 2;
    var anyBox = items.some(function (it) { return it.photo; });
    this.need(L_GAP + (anyBox ? h : 0));
    var doc = this.doc, pg = this.pg, y = this.y, fill = document.body.getAttribute("data-fit") === "fill";
    items.forEach(function (it, i) {
      var x = x0 + i * (w + g);
      var lab = it.label, fs = LABEL_FS;
      while (tw(lab, fs, false) > w + g * 0.6 && fs > 6.5) fs -= 0.5;
      doc.text(pg, lab, x + (w - tw(lab, fs, false)) / 2, y, fs, false);
      if (it.photo) {
        var im = it.photo, by = y + L_GAP;
        if (fill) { var r = Math.max(w / im.w, h / im.h); doc.imageFill(pg, it.id, x, by, w, h, im.w * r, im.h * r); }
        else { var r2 = Math.min(w / im.w, h / im.h), iw = im.w * r2, ih = im.h * r2; doc.image(pg, it.id, x + (w - iw) / 2, by + (h - ih) / 2, iw, ih); }
      }
    });
    this.y += L_GAP + (anyBox ? h + R_GAP : cm(0.2));
  };
  /* Tabla de datos de la primera hoja: 10 filas, 4 columnas (las filas de 1 dato unen las columnas 2 a 4) */
  Sheet.prototype.infoTable = function () {
    var d = this.doc, pg = this.pg, W = [5.49, 4.75, 2.49, 4.25].map(cm), x0 = M_LEFT, rh = cm(0.6), pad = cm(0.15), y0 = this.y;
    function cell(x, yy, w, text, bold) {
      d.box(pg, x, yy, w, rh);
      var f = fitLine(text, w - 2 * pad, 10, bold, 6.5);
      d.text(pg, f.s, x + pad, yy + rh / 2 - 0.45 * f.fs, f.fs, bold);
    }
    function value(f) { var v = val(f.id); return f.type === "date" ? dateFmt(v) : v; }
    INFO.forEach(function (r, i) {
      var yy = y0 + i * rh;
      if (r.length === 1) { cell(x0, yy, W[0], r[0].label, false); cell(x0 + W[0], yy, W[1] + W[2] + W[3], value(r[0]), false); }
      else {
        cell(x0, yy, W[0], r[0].label, false); cell(x0 + W[0], yy, W[1], value(r[0]), false);
        cell(x0 + W[0] + W[1], yy, W[2], r[1].label, false); cell(x0 + W[0] + W[1] + W[2], yy, W[3], value(r[1]), false);
      }
    });
    this.y = y0 + INFO.length * rh;
  };

  function layoutReport(doc, ids) {
    function item(label, key, photo) {
      var p = photo === undefined ? P[key] : photo;
      if (!p || !p.ready) return null;
      return { label: label, photo: p, id: doc.addImage(p.bytes, p.w, p.h) };
    }
    function pairs(list) { return list.filter(Boolean); }
    function rows2(sh, items, size) { for (var i = 0; i < items.length; i += 2) sh.row(items.slice(i, i + 2), size.w, size.h, size.gap); }
    var std = SIZE.std, any = function (l) { return l.length > 0; };
    function sheet() { return new Sheet(doc, ids); }
    /* Hoja(s) con recuadros en cantidad variable: título solo en la primera, 4 recuadros por hoja */
    function paged(titleText, list, prefix) {
      var its = []; list.forEach(function (p, i) { var it = item(prefix + " " + (i + 1), null, p); if (it) its.push(it); });
      for (var i = 0; i < its.length; i += 4) {
        var sh = sheet(); if (i === 0) sh.title(titleText);
        rows2(sh, its.slice(i, i + 4), std);
      }
    }
    function fixed4(titleText, items) { if (items.length) { var sh = sheet(); sh.title(titleText); rows2(sh, items, std); } }
    function termoPage(K, titleText) {
      var g = item("", K + "g");
      var sn = [0, 1, 2].map(function (i) {
        var code = SNS[K] ? SNS[K][i] : "", it = item("S/N" + (i + 1) + (code ? ": " + code : ":"), K + (i + 1));
        if (it) return it;
        return code ? { label: "S/N" + (i + 1) + ": " + code, photo: null } : null;
      }).filter(Boolean);
      if (!g && !sn.length) return;
      var sh = sheet(); sh.title(titleText);
      if (g) { g.label = ""; sh.y -= L_GAP; sh.row([g], SIZE.wide.w, SIZE.wide.h, 0); }
      if (sn.length) sh.row(sn, SIZE.termo.w, SIZE.termo.h, SIZE.termo.gap);
    }

    /* 1. Información (tabla) y transporte: siempre */
    var s = sheet();
    s.infoTable();
    var tr = pairs([item("Perfil derecho", "t_pd"), item("Perfil izquierdo", "t_pi"), item("Perfil frontal", "t_pf"), item("Placa", "t_pl")]);
    if (tr.length) { s.gap(0.3); s.title("TRANSPORTE"); rows2(s, tr, SIZE.transp); }

    /* 2. Contenedor y número de contenedor */
    var c1 = pairs([item("Fotografía 1", "c_f1"), item("Fotografía 2", "c_f2")]);
    var c2 = pairs([item("Frontal", "n_fr"), item("Posterior", "n_po")]);
    if (any(c1) || any(c2)) {
      s = sheet();
      if (c1.length) { s.title("CONTENEDOR"); rows2(s, c1, std); }
      if (c2.length) { s.title("NÚMERO DE CONTENEDOR"); rows2(s, c2, std); }
    }

    /* 3 y 4. Laterales, superiores e interno */
    var lat = pairs([item("Lateral izquierdo", "l_iz"), item("Lateral derecho", "l_de")]);
    var sup = pairs([item("Superior inicio", "s_in"), item("Superior final", "s_fi")]);
    var inte = item("Interno", "interno");
    if (lat.length || sup.length || inte) {
      s = sheet();
      if (lat.length) rows2(s, lat, std);
      if (sup.length) { rows2(s, sup, std); if (inte) { s = sheet(); s.row([inte], std.w, std.h, std.gap); } }
      else if (inte) s.row([inte], std.w, std.h, std.gap);
    }

    /* 5. Seguros del contenedor */
    fixed4("SEGUROS DEL CONTENEDOR", pairs([item("Pin de guía delantero izquierdo", "sc_pdi"), item("Pin de guía delantero derecho", "sc_pdd"), item("Twistlocks izquierdo", "sc_tli"), item("Twistlocks derecho", "sc_tld")]));

    /* 6 a 9. Hojas con cantidad variable */
    paged("REGISTROS ADICIONALES", LISTS.reg, "Registro");
    paged("TEMPERATURA DE LLEGADA", LISTS.tl, "Temperatura de llegada");
    paged("TEMPERATURA DE LA FLOR", LISTS.tf, "Temperatura de la flor");
    paged("FILAS DEL CONTENEDOR", LISTS.filas, "Fila");

    /* 10 a 12. Termógrafos */
    termoPage("tL", "TERMÓGRAFOS LOGIZTIK GROUP");
    termoPage("tS", "TERMÓGRAFOS SATELITALES");
    termoPage("tE", "TERMÓGRAFOS EXPORTADOR");

    /* 13. Temperatura de salida */
    paged("TEMPERATURA DE SALIDA", LISTS.ts, "Temperatura de salida");

    /* 14. Datos del conductor */
    var ced = item("Cédula", "ced"), lic = item("Licencia", "lic"), mat = item("Matrícula", "mat");
    if (ced || lic || mat) {
      s = sheet(); s.title("DATOS DEL CONDUCTOR");
      if (ced) s.row([ced], SIZE.ced.w, SIZE.ced.h, 0);
      if (lic) s.row([lic], SIZE.ced.w, SIZE.ced.h, 0);
      if (mat) s.row([mat], SIZE.mat.w, SIZE.mat.h, 0);
    }

    /* 15 a 19. Kits de sellos, seguros extras y candado */
    fixed4("KIT SELLOS DE SEGURIDAD LOGIZTIK GROUP", pairs([item("Funda de sellos", "k_fu"), item("Seguro de cable", "k_ca"), item("Seguro de botella", "k_bo"), item("Seguro de etiqueta", "k_et")]));
    paged("SEGUROS EXTRAS LOGIZTIK GROUP", LISTS.sx, "Seguro extra");
    paged("KIT SELLOS DE SEGURIDAD NAVIERA", LISTS.nav, "Seguro naviera");
    paged("KIT SELLOS DE SEGURIDAD EXPORTADOR", LISTS.exp, "Seguro Exportador");
    paged("CANDADO SATELITAL", LISTS.cd, "Candado");

    /* 20. Contenedor sellado */
    paged("CONTENEDOR SELLADO", LISTS.sell, "Sellado");

    /* 21. Salida del contenedor */
    var sal = item("", "sal");
    if (sal) { s = sheet(); s.title("SALIDA DEL CONTENEDOR"); sal.label = ""; s.y -= L_GAP; s.row([sal], SIZE.salida.w, SIZE.salida.h, 0); }
  }

  function loadLogo() {
    return new Promise(function (resolve, reject) {
      var im = new Image();
      im.onload = function () {
        var cv = document.createElement("canvas"); cv.width = im.naturalWidth; cv.height = im.naturalHeight;
        var cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0);
        cv.toBlob(function (b) { b.arrayBuffer().then(function (buf) { resolve({ bytes: new Uint8Array(buf), w: cv.width, h: cv.height }); }); }, "image/jpeg", 0.92);
      };
      im.onerror = reject; im.src = LOGO_SRC;
    });
  }

  function fileName() {
    var base = [val("exportador") || val("cliente"), val("contenedor"), val("fecha")].filter(Boolean).join("_") || "reporte_contenedor";
    return base.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9_\-]+/g, "_").replace(/^_+|_+$/g, "") + ".pdf";
  }
  var downloadsP = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(function () { return null; }) : Promise.resolve(null);

  goEl.addEventListener("click", function () {
    if (generating) return;
    generating = true; goEl.disabled = true; setStatus("Armando el PDF…");
    loadLogo().then(function (logo) {
      var doc = new PdfDoc(); var lid = doc.addImage(logo.bytes, logo.w, logo.h);
      var fb = atob(FOOT_B64), fa = new Uint8Array(fb.length); for (var q = 0; q < fb.length; q++) fa[q] = fb.charCodeAt(q);
      layoutReport(doc, { logo: lid, foot: doc.addImage(fa, 1600, 583) });
      var blob = new Blob([doc.build()], { type: "application/pdf" });
      return downloadsP.then(function (dl) {
        if (!dl) {
          var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName(); a.style.display = "none";
          document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
          return { status: "saved" };
        }
        return dl.save({ filename: fileName(), data: blob });
      }).then(function () { generating = false; changed(); setStatus("PDF listo: " + fileName() + " (" + (blob.size / 1048576).toFixed(1) + " MB)", "ok"); });
    }).catch(function (e) {
      generating = false; changed();
      var code = e && e.code;
      if (code === "declined") setStatus("Descarga cancelada. Puedes volver a intentarlo.");
      else if (code === "unavailable" || code === "not_granted" || code === "capability_disabled") setStatus("Esta vista no permite descargar archivos. Abre el reporte desde claude.ai.", "err");
      else setStatus("No se pudo generar el PDF. Revisa las fotos e inténtalo de nuevo.", "err");
    });
  });

  /* ======== Inicio ======== */
  SHEETS.forEach(function (S) { sheetsEl.appendChild(buildSheet(S)); });
  document.getElementById("openAll").onclick = function () { document.querySelectorAll("details.sheet").forEach(function (d) { d.open = true; }); };
  document.getElementById("closeAll").onclick = function () { document.querySelectorAll("details.sheet").forEach(function (d) { d.open = false; }); };
  var fitSel = document.getElementById("fit");
  document.body.setAttribute("data-fit", "fit");
  fitSel.addEventListener("change", function () { document.body.setAttribute("data-fit", fitSel.value); });
  changed();
})();
</script>
